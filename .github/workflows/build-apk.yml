name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          mkdir -p www
          cp index.html app.js app.css www/
          sed -i 's#</head>#<link rel="stylesheet" href="app.css">\n</head>#; s#</body>#<script src="app.js"></script>\n</body>#' www/index.html
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NeonCut-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
